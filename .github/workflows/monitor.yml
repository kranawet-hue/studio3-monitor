name: Studio3 Tracker – Cloud-Überwachung
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio3-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
        with:
          # Read the newest saved state after acquiring the concurrency slot.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cloud/requirements.txt
      - name: Browser und Python-Bibliotheken installieren
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Logiktests
        run: python -m pytest -q
      - name: Studio3 öffentlich prüfen
        run: python tracker.py
      - name: Stand für Handy veröffentlichen
        if: success()
        run: |
          git config user.name 'studio3-bot'
          git config user.email 'studio3-bot@users.noreply.github.com'
          git add data/tracker-state.json public/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Studio3 Tracker data [skip ci]'
            git push
          fi
      - name: Bei Problemen Screenshot für Diagnose sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio3-diagnose
          path: cloud/debug/failure.png
          if-no-files-found: ignore
          retention-days: 3
